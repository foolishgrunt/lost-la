<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost Los Angeles (prototype)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/Widgets/widgets.css">
<script src="https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/Cesium.js"></script>
<style>
  html, body, #map { margin: 0; height: 100%; background: #1d2a2e; font-family: Georgia, serif; }
  #panel { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); width: min(560px, 92vw);
    background: rgba(22,32,30,.88); color: #eee6d2; padding: 12px 18px 14px; border-radius: 6px; }
  #era { font-size: 26px; margin: 0 0 4px; }
  #note { font-size: 13px; opacity: .8; margin: 6px 0 0; line-height: 1.4; }
  #slider { width: 100%; accent-color: #9cc9a6; }
  #ticks { display: flex; justify-content: space-between; font-size: 12px; opacity: .7; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <p id="era"></p>
  <input id="slider" type="range" min="0" max="6" step="1" value="1">
  <div id="ticks"></div>
  <p id="note">Placeholder data for testing. Click a feature to see its sources. Zoom in close to see vegetation appear.</p>
</div>
<script>
const ERAS = [1769, 1850, 1870, 1900, 1925, 1950, 2026];
const Z = 13;                 // highest terrain tile level used (about 16 m per pixel here)
// Plant shapes. 'near' = camera height (m) below which they are drawn; c = RGB 0-1. Add a kind here, then use it in landtypes.json.
const VEG = {
  tree:  { len: 10,  top: 0,  bot: 3,   sl: 8, c: [.15, .38, .16], near: 9000 },
  reed:  { len: 2.5, top: .9, bot: .15, sl: 6, c: [.55, .62, .30], near: 3500 },
  shrub: { len: 1.6, top: .5, bot: 1.3, sl: 7, c: [.45, .52, .30], near: 4500 }
};

const say = m => { document.getElementById('note').textContent = m; };
window.addEventListener('error', e => say('Error: ' + e.message));
window.addEventListener('unhandledrejection', e => say('Error: ' + (e.reason && e.reason.message || e.reason)));
if (location.protocol === 'file:') say('This page was opened from a file. Features will not load this way; open it from your GitHub Pages address instead.');

// ---------- Terrain: free AWS tiles (derived from USGS 3DEP), decoded in the browser ----------
const loaded = new Map(), pending = new Map();
function getTile(z, x, y) {
  const k = z + '/' + x + '/' + y;
  if (!pending.has(k)) pending.set(k, new Promise(res => {
    const im = new Image(); im.crossOrigin = 'anonymous';
    im.onload = () => {
      try {
        const c = document.createElement('canvas'); c.width = c.height = 256;
        const g = c.getContext('2d'); g.drawImage(im, 0, 0);
        const d = g.getImageData(0, 0, 256, 256).data, h = new Float32Array(65536);
        for (let i = 0; i < 65536; i++) h[i] = d[i*4]*256 + d[i*4+1] + d[i*4+2]/256 - 32768;
        loaded.set(k, h); res(h);
      } catch (err) { say('Terrain tile could not be read: ' + err.message); res(new Float32Array(65536)); }
    };
    im.onerror = () => { say('Terrain tile failed to download (blocked by the browser or an extension?): ' + im.src); res(new Float32Array(65536)); };
    im.src = `https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${z}/${x}/${y}.png`;
  }));
  return pending.get(k);
}

// ---------- Terrain edits for the selected era ----------
let edits = [];   // [{ring: [[lon,lat],...], elev}]
function inside(lon, lat, ring) {
  let c = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if ((yi > lat) !== (yj > lat) && lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) c = !c;
  }
  return c;
}
const adjust = (lon, lat, h) => { for (const e of edits) if (inside(lon, lat, e.ring)) return e.elev; return h; };

function makeProvider() {
  return new Cesium.CustomHeightmapTerrainProvider({
    tilingScheme: new Cesium.WebMercatorTilingScheme(), width: 65, height: 65,
    callback: async (x, y, l) => {
      const z = Math.min(l, Z), s = l - z, n = 2 ** l, sc = 2 ** s, out = new Float32Array(4225);
      const h = await getTile(z, x >> s, y >> s);
      for (let j = 0; j < 65; j++) {
        const lat = Math.atan(Math.sinh(Math.PI * (1 - 2 * (y + j/64) / n))) * 180 / Math.PI;
        const py = Math.min(255, (((y & (sc-1)) + j/64) / sc * 256) | 0);
        for (let i = 0; i < 65; i++) {
          const lon = (x + i/64) / n * 360 - 180;
          const px = Math.min(255, (((x & (sc-1)) + i/64) / sc * 256) | 0);
          out[j*65 + i] = adjust(lon, lat, h[py*256 + px]);
        }
      }
      return out;
    }
  });
}

// Synchronous ground height (tiles must already be loaded) so plants can sit on the ground
function groundAt(lon, lat) {
  const n = 2 ** Z, r = lat * Math.PI / 180;
  const fx = (lon + 180) / 360 * n, fy = (1 - Math.log(Math.tan(r) + 1/Math.cos(r)) / Math.PI) / 2 * n;
  const tx = Math.floor(fx), ty = Math.floor(fy), h = loaded.get(`${Z}/${tx}/${ty}`);
  const base = h ? h[Math.min(255, ((fy-ty)*256)|0) * 256 + Math.min(255, ((fx-tx)*256)|0)] : 0;
  return adjust(lon, lat, base);
}

// ---------- Viewer ----------
Cesium.Ion.defaultAccessToken = '';
const viewer = new Cesium.Viewer('map', {
  baseLayer: false, terrainProvider: makeProvider(),
  baseLayerPicker: false, geocoder: false, homeButton: false, timeline: false, animation: false,
  navigationHelpButton: false, sceneModePicker: false, fullscreenButton: false, infoBox: true
});
viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString('#8a9a6b');
// ---------- Ground color: elevation tint + hillshade, drawn from the same elevation tiles ----------
const STOPS = [[-50,[46,82,115]],[0,[71,115,140]],[2,[153,179,128]],[30,[158,168,107]],[200,[184,158,102]],[900,[140,107,82]],[1800,[209,199,184]]];
function tint(h) {
  if (h <= STOPS[0][0]) return STOPS[0][1];
  for (let i = 1; i < STOPS.length; i++) if (h <= STOPS[i][0]) {
    const [h0, c0] = STOPS[i-1], [h1, c1] = STOPS[i], t = (h - h0) / (h1 - h0);
    return c0.map((v, k) => v + (c1[k] - v) * t);
  }
  return STOPS[STOPS.length - 1][1];
}
const EXAGGERATE = 3, LIGHT = [-.5, .5, .7071];   // light from the northwest, 45 degrees up
async function shadeTile(x, y, l) {
  const z = Math.min(l, Z), s = l - z, sc = 2 ** s, n = 2 ** l, W = 258;
  const src = await getTile(z, x >> s, y >> s);
  const ox = (x & (sc-1)) * 256 / sc, oy = (y & (sc-1)) * 256 / sc, step = 1 / sc;
  const at = (u, v) => {
    u = Math.max(0, Math.min(254.99, u)); v = Math.max(0, Math.min(254.99, v));
    const i = u | 0, j = v | 0, fu = u - i, fv = v - j, p = j * 256 + i;
    return (src[p]*(1-fu) + src[p+1]*fu) * (1-fv) + (src[p+256]*(1-fu) + src[p+257]*fu) * fv;
  };
  const H = new Float32Array(W * W), cell = [];
  for (let py = -1; py <= 256; py++) {
    const lat = Math.atan(Math.sinh(Math.PI * (1 - 2 * (y + py/256) / n))) * 180 / Math.PI;
    cell[py+1] = 40075016.686 / (n * 256) * Math.cos(lat * Math.PI / 180);
    for (let px = -1; px <= 256; px++)
      H[(py+1)*W + px+1] = adjust((x + px/256) / n * 360 - 180, lat, at(ox + px*step, oy + py*step));
  }
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const g = cv.getContext('2d'), img = g.createImageData(256, 256), d = img.data;
  for (let py = 0; py < 256; py++) for (let px = 0; px < 256; px++) {
    const i = (py+1)*W + px+1, c2 = 2 * cell[py+1];
    const nx = -(H[i+1] - H[i-1]) / c2 * EXAGGERATE, ny = -(H[i-W] - H[i+W]) / c2 * EXAGGERATE;
    const sh = (nx*LIGHT[0] + ny*LIGHT[1] + LIGHT[2]) / Math.hypot(nx, ny, 1);
    const m = Math.max(.35, Math.min(1.35, .4 + .6 * sh / .7071)), c = tint(H[i]), o = (py*256 + px) * 4;
    d[o] = Math.min(255, c[0]*m); d[o+1] = Math.min(255, c[1]*m); d[o+2] = Math.min(255, c[2]*m); d[o+3] = 255;
  }
  g.putImageData(img, 0, 0);
  return cv;
}
function refreshImagery() {
  viewer.imageryLayers.removeAll();
  const p = new Cesium.UrlTemplateImageryProvider({ url: '/{z}/{x}/{y}', tilingScheme: new Cesium.WebMercatorTilingScheme(),
    maximumLevel: 18, credit: 'Terrain: USGS 3DEP and SRTM via AWS Terrain Tiles' });
  p.requestImage = (x, y, l) => shadeTile(x, y, l);
  viewer.imageryLayers.addImageryProvider(p);
}

refreshImagery();
viewer.camera.setView({
  destination: Cesium.Cartesian3.fromDegrees(-118.43, 33.90, 9000),
  orientation: { heading: 0, pitch: Cesium.Math.toRadians(-32), roll: 0 }
});

// ---------- Features ----------
let items = [], plants = [];
function rng(seed) { let a = seed; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const ALPHA = { documented: .65, inferred: .45, speculative: .3 };

(async () => {
  const reg = await (await fetch('data/landtypes.json')).json();
  const TYPES = Object.fromEntries(reg.types.map(t => [t.id, t]));
  const ds = await Cesium.GeoJsonDataSource.load('data/features.geojson', { clampToGround: true });
  await viewer.dataSources.add(ds);
  const LAYER = { natural: 0, agricultural: 1, urban: 2 };   // later layers draw on top
  for (const e of ds.entities.values) {
    const p = e.properties.getValue(Cesium.JulianDate.now());
    const T = TYPES[p.landtype];
    if (!T) { say('Unknown landtype "' + p.landtype + '" in feature ' + p.feature_id); e.show = false; continue; }
    p.vegetation = p.vegetation ?? T.vegetation; p.density_per_ha = p.density_per_ha ?? T.density_per_ha;
    const a = ALPHA[p.confidence] ?? .3, dashed = p.confidence !== 'documented';
    const col = Cesium.Color.fromCssColorString(T.color);
    const lineMat = (c, dash) => dash ? new Cesium.PolylineDashMaterialProperty({ color: c, dashLength: 14 }) : c;
    let extra = null, ring = null;
    if (e.polygon) {
      const pos = e.polygon.hierarchy.getValue().positions;
      ring = pos.map(c => { const g = Cesium.Cartographic.fromCartesian(c); return [Cesium.Math.toDegrees(g.longitude), Cesium.Math.toDegrees(g.latitude)]; });
      e.polygon.material = T.pattern === 'hatch'
        ? new Cesium.StripeMaterialProperty({ evenColor: col.withAlpha(a), oddColor: col.withAlpha(0), repeat: 16, orientation: Cesium.StripeOrientation.VERTICAL })
        : T.pattern === 'grid'
        ? new Cesium.GridMaterialProperty({ color: col.withAlpha(a + .25), cellAlpha: 0, lineCount: new Cesium.Cartesian2(12, 12), lineThickness: new Cesium.Cartesian2(1.5, 1.5) })
        : col.withAlpha(a);
      e.polygon.outline = false;
      e.polygon.zIndex = LAYER[T.category] ?? 0;
      extra = viewer.entities.add({ polyline: { positions: pos.concat(pos[0]), width: 2, clampToGround: true, material: lineMat(col, dashed) } });
    } else if (e.polyline) {
      e.polyline.material = lineMat(col, dashed || T.dash); e.polyline.width = T.width || 3;
    } else if (e.billboard) {
      e.billboard = undefined;
      e.point = new Cesium.PointGraphics({ pixelSize: 10, color: col, outlineColor: Cesium.Color.WHITE, outlineWidth: 2, heightReference: Cesium.HeightReference.CLAMP_TO_GROUND });
    }
    items.push({ e, extra, p, ring });
  }
  setEra(+document.getElementById('slider').value);
})();

async function setEra(i) {
  const yr = ERAS[i];
  document.getElementById('era').textContent = yr === 2026 ? 'Today' : (i === 0 ? 'About ' : 'c. ') + yr;
  const active = items.filter(it => it.p.valid_from <= yr && yr <= (it.p.valid_to ?? 9999));
  for (const it of items) { const on = active.includes(it); it.e.show = on; if (it.extra) it.extra.show = on; }

  edits = active.filter(it => it.ring && typeof it.p.terrain_edit_m === 'number').map(it => ({ ring: it.ring, elev: it.p.terrain_edit_m }));
  viewer.terrainProvider = makeProvider();   // re-reads terrain with this era's edits
  refreshImagery();

  plants.forEach(pr => viewer.scene.primitives.remove(pr.prim)); plants = [];
  const n = 2 ** Z;
  for (const it of active) {
    const V = VEG[it.p.vegetation]; if (!it.ring || !V) continue;
    const lons = it.ring.map(r => r[0]), lats = it.ring.map(r => r[1]);
    const [x0, x1, y0, y1] = [Math.min(...lons), Math.max(...lons), Math.min(...lats), Math.max(...lats)];
    const tx = l => Math.floor((l + 180) / 360 * n), ty = la => { const r = la * Math.PI / 180; return Math.floor((1 - Math.log(Math.tan(r) + 1/Math.cos(r)) / Math.PI) / 2 * n); };
    const loads = [];
    for (let x = tx(x0); x <= tx(x1); x++) for (let y = ty(y1); y <= ty(y0); y++) loads.push(getTile(Z, x, y));
    await Promise.all(loads);

    const areaHa = Math.abs(it.ring.reduce((s, [a, b], k, r) => { const [c, d] = r[(k+1) % r.length]; return s + (a*d - c*b); }, 0)) / 2 * 111320 * 111320 * Math.cos(y0 * Math.PI / 180) / 1e4;
    const count = Math.min(15000, Math.round(areaHa * (it.p.density_per_ha || 1)));
    const rand = rng([...it.p.feature_id].reduce((s, c) => s * 31 + c.charCodeAt(0), 7));
    const geom = new Cesium.CylinderGeometry({ length: V.len, topRadius: V.top, bottomRadius: V.bot, slices: V.sl, vertexFormat: Cesium.PerInstanceColorAppearance.VERTEX_FORMAT });
    const instances = [];
    for (let k = 0, tries = 0; k < count && tries < count * 20; tries++) {
      const lon = x0 + rand() * (x1 - x0), lat = y0 + rand() * (y1 - y0);
      if (!inside(lon, lat, it.ring)) continue;
      k++;
      const s = .7 + rand() * .6, enu = Cesium.Transforms.eastNorthUpToFixedFrame(Cesium.Cartesian3.fromDegrees(lon, lat, groundAt(lon, lat)));
      const m = Cesium.Matrix4.multiplyByTranslation(enu, new Cesium.Cartesian3(0, 0, (V.len / 2) * s), new Cesium.Matrix4());
      Cesium.Matrix4.multiplyByUniformScale(m, s, m);
      const shade = .8 + rand() * .4;
      instances.push(new Cesium.GeometryInstance({ geometry: geom, modelMatrix: m, attributes: { color: Cesium.ColorGeometryInstanceAttribute.fromColor(
        new Cesium.Color(V.c[0] * shade, V.c[1] * shade, V.c[2] * shade, 1)) } }));
    }
    if (!instances.length) continue;
    const prim = viewer.scene.primitives.add(new Cesium.Primitive({ geometryInstances: instances, asynchronous: false,
      appearance: new Cesium.PerInstanceColorAppearance({ translucent: false, closed: true }) }));
    plants.push({ prim, near: V.near });
  }
}

// Show vegetation only when the camera is close (zoom-dependent detail)
viewer.scene.preRender.addEventListener(() => {
  const h = viewer.camera.positionCartographic.height;
  plants.forEach(pr => { pr.prim.show = h < pr.near; });
});

const slider = document.getElementById('slider');
document.getElementById('ticks').innerHTML = ERAS.map(y => `<span>${y === 2026 ? 'Today' : y}</span>`).join('');
document.getElementById('era').textContent = 'c. 1850';
slider.addEventListener('change', () => setEra(+slider.value));
slider.addEventListener('input', () => { document.getElementById('era').textContent = ERAS[+slider.value] === 2026 ? 'Today' : 'c. ' + ERAS[+slider.value]; });
</script>
</body>
</html>
